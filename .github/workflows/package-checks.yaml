name: Package checks

# Проверки самого пакета слоя: то, что не требует Coddy, Go и сборки. Они
# запускаются уже на первом публичном коммите, чтобы первый же коммит попал под
# контроль, а не вышел без него.
#
# Всё то же самое можно прогнать руками: bash checks.sh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Состав, манифест, секреты, синтаксис
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверки пакета
        run: bash checks.sh

      - name: Манифест сверен с overlay
        run: |
          # Отдельный шаг, чтобы в интерфейсе было видно именно это, а не строку
          # внутри общего вывода: расхождение манифеста — самая частая поломка
          # слоя, и она должна читаться сразу.
          bash checks.sh | grep -E '^== манифест|ок: все sha256|ПРОВАЛ'
